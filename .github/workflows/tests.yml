name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 单元测试只覆盖环境、奖励、数据管线校验与演示策略，不触碰训练依赖
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest openai python-dotenv tqdm

      - name: Run tests
        run: python -m pytest tests -q

      - name: Offline demo (no API key required)
        run: python scripts/cli.py sweep --skills 1.0,0.6,0.2